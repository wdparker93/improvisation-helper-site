<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Note head (filled, rotated ellipse) -->
  <ellipse cx="19" cy="48" rx="13" ry="9" transform="rotate(-22 19 48)" fill="#8B5CF6"/>
  <!-- Stem -->
  <rect x="30" y="10" width="4" height="38" rx="2" fill="#8B5CF6"/>
  <!-- Circuit junction ring on stem -->
  <circle cx="32" cy="27" r="4.5" fill="none" stroke="#C4B5FD" stroke-width="2"/>
  <!-- Horizontal circuit trace right from stem -->
  <line x1="36.5" y1="27" x2="50" y2="27" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round"/>
  <!-- Circuit node square at end of trace -->
  <rect x="48" y="24" width="6" height="6" rx="1.5" fill="#A78BFA"/>
  <!-- Small nodes on note head -->
  <circle cx="13" cy="46" r="2" fill="#C4B5FD"/>
  <circle cx="22" cy="51" r="2" fill="#C4B5FD"/>
  <line x1="13" y1="46" x2="22" y2="51" stroke="#C4B5FD" stroke-width="1.5" stroke-linecap="round"/>
</svg>
