<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Music note head -->
  <ellipse cx="14" cy="50" rx="11" ry="8" transform="rotate(-22 14 50)" fill="#8B5CF6"/>
  <!-- Stem -->
  <rect x="23" y="8" width="3.5" height="42" rx="1.5" fill="#8B5CF6"/>

  <!-- Transistor 1 — base at y=13 -->
  <line x1="26.5" y1="13" x2="36" y2="13" stroke="#A78BFA" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="36" y1="7"  x2="36" y2="20" stroke="#A78BFA" stroke-width="2"   stroke-linecap="round"/>
  <circle cx="36" cy="13" r="1.8" fill="#C4B5FD"/>
  <line x1="36" y1="9"  x2="52" y2="4"  stroke="#C4B5FD" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="36" y1="18" x2="52" y2="22" stroke="#C4B5FD" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Transistor 2 — base at y=29 -->
  <line x1="26.5" y1="29" x2="36" y2="29" stroke="#A78BFA" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="36" y1="23" x2="36" y2="35" stroke="#A78BFA" stroke-width="2"   stroke-linecap="round"/>
  <circle cx="36" cy="29" r="1.8" fill="#C4B5FD"/>
  <line x1="36" y1="25" x2="52" y2="22" stroke="#C4B5FD" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="36" y1="33" x2="52" y2="37" stroke="#C4B5FD" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Transistor 3 — base at y=44 -->
  <line x1="26.5" y1="44" x2="36" y2="44" stroke="#A78BFA" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="36" y1="38" x2="36" y2="50" stroke="#A78BFA" stroke-width="2"   stroke-linecap="round"/>
  <circle cx="36" cy="44" r="1.8" fill="#C4B5FD"/>
  <line x1="36" y1="40" x2="52" y2="37" stroke="#C4B5FD" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="36" y1="48" x2="52" y2="52" stroke="#C4B5FD" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Pads: T1-collector | T1-emitter/T2-collector | T2-emitter/T3-collector | T3-emitter -->
  <circle cx="52" cy="4"  r="2.5" fill="#F5F3FF"/>
  <circle cx="52" cy="22" r="3"   fill="#F5F3FF"/>
  <circle cx="52" cy="37" r="3"   fill="#F5F3FF"/>
  <circle cx="52" cy="52" r="2.5" fill="#F5F3FF"/>
</svg>
